name: mindguard

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cognitive_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cognitive_db}
      MYSQL_USER: ${MYSQL_USER:-cognitive_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cognitive_pass_2026}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cognitive_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cognitive_minio_2026}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  influxdb:
    image: influxdb:2.7.11-alpine
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-cognitive_influx_2026}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-cognitive-org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-behavior-data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-cognitive_influx_token_2026}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-cognitive_mongo_2026}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-cognitive_features}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MindGuard}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      AI_MODEL_STRATEGY: ${AI_MODEL_STRATEGY:-hybrid}
      DEEP_MODEL_CHECKPOINT: ${DEEP_MODEL_CHECKPOINT:-models/deep_multimodal_fusion.pt}
      DEEP_MODEL_DEVICE: ${DEEP_MODEL_DEVICE:-cpu}
      DEEP_MODEL_ALLOW_RANDOM_INIT: ${DEEP_MODEL_ALLOW_RANDOM_INIT:-false}
      DEEP_MODEL_BLEND_ALPHA: ${DEEP_MODEL_BLEND_ALPHA:-0.65}
      SECRET_KEY: ${SECRET_KEY:-cognitive-secret-key-change-in-production-2026}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-cognitive_user}:${MYSQL_PASSWORD:-cognitive_pass_2026}@mysql:3306/${MYSQL_DATABASE:-cognitive_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_BEAT_ENABLED: ${CELERY_BEAT_ENABLED:-true}
      CELERY_BEAT_ADHERENCE_INTERVAL_MINUTES: ${CELERY_BEAT_ADHERENCE_INTERVAL_MINUTES:-30}
      CELERY_BEAT_ADHERENCE_DUE_ONLY: ${CELERY_BEAT_ADHERENCE_DUE_ONLY:-true}
      CELERY_BEAT_REASSESSMENT_INTERVAL_MINUTES: ${CELERY_BEAT_REASSESSMENT_INTERVAL_MINUTES:-120}
      CELERY_BEAT_REASSESSMENT_WITHIN_DAYS: ${CELERY_BEAT_REASSESSMENT_WITHIN_DAYS:-7}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cognitive_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cognitive_minio_2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-cognitive-files}
      MINIO_SECURE: "false"
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
      WECHAT_TEMPLATE_ID_ADHERENCE: ${WECHAT_TEMPLATE_ID_ADHERENCE:-}
      WECHAT_TEMPLATE_ID_REASSESSMENT: ${WECHAT_TEMPLATE_ID_REASSESSMENT:-}
      WECHAT_MINIPROGRAM_PAGE: ${WECHAT_MINIPROGRAM_PAGE:-pages/index/index}
      WECHAT_MOCK_MODE: ${WECHAT_MOCK_MODE:-true}
      CORS_ORIGINS: '["https://admin.zhouchao5563.online","https://api.zhouchao5563.online","https://servicewechat.com","http://localhost","http://127.0.0.1","http://localhost:5173","http://localhost:3000"]'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "python -m app.initial_data &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-false}
      AI_MODEL_STRATEGY: ${AI_MODEL_STRATEGY:-hybrid}
      DEEP_MODEL_CHECKPOINT: ${DEEP_MODEL_CHECKPOINT:-models/deep_multimodal_fusion.pt}
      DEEP_MODEL_DEVICE: ${DEEP_MODEL_DEVICE:-cpu}
      DEEP_MODEL_ALLOW_RANDOM_INIT: ${DEEP_MODEL_ALLOW_RANDOM_INIT:-false}
      DEEP_MODEL_BLEND_ALPHA: ${DEEP_MODEL_BLEND_ALPHA:-0.65}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-cognitive_user}:${MYSQL_PASSWORD:-cognitive_pass_2026}@mysql:3306/${MYSQL_DATABASE:-cognitive_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_BEAT_ENABLED: ${CELERY_BEAT_ENABLED:-true}
      CELERY_BEAT_ADHERENCE_INTERVAL_MINUTES: ${CELERY_BEAT_ADHERENCE_INTERVAL_MINUTES:-30}
      CELERY_BEAT_ADHERENCE_DUE_ONLY: ${CELERY_BEAT_ADHERENCE_DUE_ONLY:-true}
      CELERY_BEAT_REASSESSMENT_INTERVAL_MINUTES: ${CELERY_BEAT_REASSESSMENT_INTERVAL_MINUTES:-120}
      CELERY_BEAT_REASSESSMENT_WITHIN_DAYS: ${CELERY_BEAT_REASSESSMENT_WITHIN_DAYS:-7}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cognitive_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cognitive_minio_2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-cognitive-files}
      MINIO_SECURE: "false"
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
      WECHAT_TEMPLATE_ID_ADHERENCE: ${WECHAT_TEMPLATE_ID_ADHERENCE:-}
      WECHAT_TEMPLATE_ID_REASSESSMENT: ${WECHAT_TEMPLATE_ID_REASSESSMENT:-}
      WECHAT_MINIPROGRAM_PAGE: ${WECHAT_MINIPROGRAM_PAGE:-pages/index/index}
      WECHAT_MOCK_MODE: ${WECHAT_MOCK_MODE:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q ai_analysis,celery

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-cognitive_user}:${MYSQL_PASSWORD:-cognitive_pass_2026}@mysql:3306/${MYSQL_DATABASE:-cognitive_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_BEAT_ENABLED: ${CELERY_BEAT_ENABLED:-true}
      CELERY_BEAT_ADHERENCE_INTERVAL_MINUTES: ${CELERY_BEAT_ADHERENCE_INTERVAL_MINUTES:-30}
      CELERY_BEAT_ADHERENCE_DUE_ONLY: ${CELERY_BEAT_ADHERENCE_DUE_ONLY:-true}
      CELERY_BEAT_REASSESSMENT_INTERVAL_MINUTES: ${CELERY_BEAT_REASSESSMENT_INTERVAL_MINUTES:-120}
      CELERY_BEAT_REASSESSMENT_WITHIN_DAYS: ${CELERY_BEAT_REASSESSMENT_WITHIN_DAYS:-7}
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
      WECHAT_TEMPLATE_ID_ADHERENCE: ${WECHAT_TEMPLATE_ID_ADHERENCE:-}
      WECHAT_TEMPLATE_ID_REASSESSMENT: ${WECHAT_TEMPLATE_ID_REASSESSMENT:-}
      WECHAT_MINIPROGRAM_PAGE: ${WECHAT_MINIPROGRAM_PAGE:-pages/index/index}
      WECHAT_MOCK_MODE: ${WECHAT_MOCK_MODE:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

  web_admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web_admin:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/admin.zhouchao5563.online_nginx:/etc/nginx/certs/admin:ro
      - ./nginx/api.zhouchao5563.online_nginx:/etc/nginx/certs/api:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  minio_data:
  influxdb_data:
  mongodb_data:

networks:
  default:
    name: mindguard_network

