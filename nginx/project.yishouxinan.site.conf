# Add this file as a new Nginx site, for example:
#   /etc/nginx/conf.d/project.yishouxinan.site.conf
#
# It uses an independent server_name, so existing admin/api virtual hosts are not changed.

server {
    listen 80;
    server_name project.yishouxinan.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name project.yishouxinan.site;

    # Replace these two paths with the existing certificate files in your Nginx directory.
    ssl_certificate     /etc/nginx/certs/project/project.yishouxinan.site_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/project/project.yishouxinan.site.key;

    client_max_body_size 50m;

    # Frontend container: real-frontend, exposed by docker-compose as 22081:80.
    location / {
        proxy_pass http://host.docker.internal:22081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Backend API container: real-backend, exposed by docker-compose as 22080:8080.
    # The frontend calls /api, so this keeps browser requests same-origin.
    location /api/ {
        proxy_pass http://host.docker.internal:22080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Public MinIO file access for uploaded rich-text images.
    # Set APP_MINIO_PUBLIC_ENDPOINT=https://project.yishouxinan.site/minio before docker compose up.
    location /minio/ {
        proxy_pass http://host.docker.internal:22000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
