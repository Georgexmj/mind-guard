map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_upstream {
    server backend:8000;
}

upstream web_upstream {
    server web_admin:80;
}

server {
    listen 80;
    server_name api.yishouxinan.site;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name admin.yishouxinan.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.yishouxinan.site;

    ssl_certificate /etc/nginx/certs/api/api.yishouxinan.site_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/api/api.yishouxinan.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.yishouxinan.site;

    ssl_certificate /etc/nginx/certs/admin/admin.yishouxinan.site_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/admin/admin.yishouxinan.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80 default_server;
    server_name _;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 404;
    }
}
